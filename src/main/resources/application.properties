spring.application.name=job-application-tracker
server.port=1234
server.address=127.0.0.1
# Chỉ dùng cookie cho session. Tránh Tomcat thêm ;jsessionid vào URL sau khi submit,
# vì URL đó có thể bỏ qua controller trang chủ và làm model Thymeleaf bị null.
server.servlet.session.tracking-modes=cookie
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
spring.jackson.serialization.write-dates-as-timestamps=false
spring.thymeleaf.cache=false
server.error.include-message=always
